  <!-- Apply saved/system theme before the page paints -->
  <script>
    (function () {
      let savedTheme = null;

      try {
        savedTheme = localStorage.getItem('edumbao-theme');
      } catch (error) {
        savedTheme = null;
      }

      const preferredTheme =
        window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';

      const theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : preferredTheme;

      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

<!-- ======================================================
     Navigation + Theme
======================================================= -->

<script>

  document.addEventListener(
    'DOMContentLoaded',
    function () {

      const menuButton =
        document.querySelector('.menu-toggle');

      const siteMenu =
        document.querySelector('.site-menu');

      const themeToggle =
        document.getElementById('theme-toggle');


      if (menuButton && siteMenu) {

        menuButton.addEventListener(
          'click',
          function () {

            const isOpen =
              siteMenu.classList.toggle('nav-open');

            menuButton.setAttribute(
              'aria-expanded',
              isOpen ? 'true' : 'false'
            );

          }
        );


        siteMenu
          .querySelectorAll('a')
          .forEach(
            function (link) {

              link.addEventListener(
                'click',
                function () {

                  siteMenu.classList.remove('nav-open');

                  menuButton.setAttribute(
                    'aria-expanded',
                    'false'
                  );

                }
              );

            }
          );

      }


      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'light'
          ? 'light'
          : 'dark';
      }


      function updateThemeLabel() {

        if (!themeToggle) {
          return;
        }

        const theme = currentTheme();
        const nextTheme = theme === 'dark' ? 'Light' : 'Dark';

        themeToggle.textContent = nextTheme;

        themeToggle.setAttribute(
          'aria-label',
          'Switch to ' + nextTheme.toLowerCase() + ' theme'
        );

      }


      updateThemeLabel();


      if (themeToggle) {

        themeToggle.addEventListener(
          'click',
          function (event) {

            event.preventDefault();

            const nextTheme =
              currentTheme() === 'dark'
                ? 'light'
                : 'dark';

            document.documentElement.setAttribute(
              'data-theme',
              nextTheme
            );

            try {
              localStorage.setItem(
                'edumbao-theme',
                nextTheme
              );
            } catch (error) {
              // Theme still works for the current page
              // if localStorage is unavailable.
            }

            updateThemeLabel();

          }
        );

      }

    }
  );

</script>
