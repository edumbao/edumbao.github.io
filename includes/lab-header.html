<!-- ======================================================
     Header
======================================================= -->

<header class="site-header">

  <div class="container site-nav">

    <a
      href="/"
      class="site-brand"
      aria-label="Ed Umbao homepage"
    >

      <span class="brand-logo-wrap" aria-hidden="true">

        <img
          src="/images/ed-umbao-logo-on-light-mode.png"
          alt=""
          class="brand-logo brand-logo-on-light"
        >

        <img
          src="/images/ed-umbao-logo-on-dark-mode.png"
          alt=""
          class="brand-logo brand-logo-on-dark"
        >

      </span>

      <span class="brand-name">
        Ed Umbao
      </span>

    </a>


    <button
      class="menu-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="site-menu"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <nav
      class="site-menu"
      id="site-menu"
      aria-label="Main navigation"
    >

      <a
        href="/lab/"
        class="is-active"
        aria-current="page"
      >
        Lab
      </a>

      <a href="/work/">
        Work
      </a>

      <a href="/writing/">
        Writing
      </a>

      <a href="/#about">
        About
      </a>

      <a
        href="https://github.com/edumbao"
        target="_blank"
        rel="noopener"
        class="nav-external"
      >
        GitHub
      </a>

      <a
        href="#"
        id="theme-toggle"
        class="theme-link"
        aria-label="Switch color theme"
      >
        Theme
      </a>

    </nav>

  </div>

</header>
